<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>2026雲科管理學題庫（上）</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="site-header">
    <div class="wrap">
      <h1>2026雲科管理學題庫（上）</h1>
      <nav id="units" class="units" aria-label="單元"></nav>
    </div>
  </header>

  <main class="wrap">
    <div class="toolbar">
      <input id="search" type="search" placeholder="搜尋題目或選項…" autocomplete="off">
      <label class="toggle">
        <input id="show-all" type="checkbox">
        <span>顯示全部答案</span>
      </label>
    </div>
    <p id="summary" class="summary"></p>
    <p class="hint">點選項直接作答，或按「看答案」。</p>
    <ol id="questions" class="questions"></ol>
    <p id="status" class="status">載入中…</p>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
